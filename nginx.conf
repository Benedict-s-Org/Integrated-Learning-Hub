server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Never long-cache the SPA shell. Stale index.html keeps old hashed JS
    # (e.g. Learning System still calling dropped grammar_micro_skills).
    # try_files SPA fallback and the index directive both re-resolve here.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Handle SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only Vite fingerprinted build output under /assets/ (name-<hash>.js|css).
    # Unhashed public/ files (furniture, fonts, grass_v2.png) must not be immutable.
    location ~* ^/assets/.+-[A-Za-z0-9_-]{6,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
